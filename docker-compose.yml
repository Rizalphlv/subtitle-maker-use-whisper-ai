services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: subtitle_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - PHP_OPCACHE_ENABLE=0
    networks:
      - subtitle_net
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:1.25-alpine
    container_name: subtitle_nginx
    restart: unless-stopped
    ports:
      - "52346:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - subtitle_net
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: subtitle_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-subtitle_system}
      MYSQL_USER: ${DB_USERNAME:-subtitle}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - subtitle_net

  redis:
    image: redis:7-alpine
    container_name: subtitle_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    networks:
      - subtitle_net

 
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: subtitle_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_DEFAULT_BUCKETS: ${AWS_BUCKET:-subtitle}
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - subtitle_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: subtitle_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=300 --queue=default,transcribe,translate
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - subtitle_net
    depends_on:
      - mysql
      - redis

  audio_queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: subtitle_audio_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work audio_subtitles --sleep=3 --tries=10 --timeout=7200 --queue=audio-subtitles
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - subtitle_net
    depends_on:
      - mysql
      - redis

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  subtitle_net:
    driver: bridge
